services:
  spotify-downloader:
    build: .
    # Issue #21: the `downloads` named volume is created root-owned by Docker,
    # while the app runs as appuser (uid 999). The image entrypoint therefore
    # starts as root, chowns /data/downloads, then drops to appuser before
    # exec'ing uvicorn — so the app itself never runs as root.
    user: root
    ports:
      - "8000:80"
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - API_KEY=${API_KEY:-}
    volumes:
      - downloads:/data/downloads
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,size=2G
      # spotdl config + yt-dlp/Deno caches; must be writable with read_only: true
      - /home/appuser:size=256M,uid=999,gid=999,mode=0700
    cap_drop:
      - ALL
    cap_add:
      # uvicorn binds port 80 inside the container
      - NET_BIND_SERVICE
      # The entrypoint needs these to (a) chown the root-owned volume and
      # (b) drop to appuser. The kernel clears the whole capability set on the
      # root -> appuser transition, so none of them reach the running app.
      - CHOWN
      - SETUID
      - SETGID

volumes:
  downloads:
