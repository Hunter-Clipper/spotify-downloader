services:
  spotify-downloader:
    build: .
    ports:
      - "8000:80"
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - API_KEY=${API_KEY:-}
    # Downloads volume ownership (issue #21): the named volume is created
    # root-owned by Docker. The container runs as appuser (uid 999), so
    # /data/downloads must be writable by appuser or spotdl falls back to /tmp
    # and downloads are lost on restart.
    #
    # Fix: run the container with `user: root` for the entrypoint, then drop
    # privileges to appuser for the app itself. If running with --privileged
    # or root is not acceptable, pre-chown the host directory backing the
    # volume to appuser:appuser and remove the user: root override.
    user: root
    entrypoint: >
      sh -c "chown -R appuser:appuser /data/downloads &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 80"
    ports:
      - "8000:80"
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - API_KEY=${API_KEY:-}
    volumes:
      - downloads:/data/downloads
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,size=2G
      # spotdl config + yt-dlp/Deno caches; must be writable with read_only: true
      - /home/appuser:size=256M,uid=999,gid=999,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  downloads:
