services:
  spotify-downloader:
    build: .
    ports:
      - "8000:80"
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - API_KEY=${API_KEY:-}
    # Downloads volume is created root-owned by Docker. After container start,
    # relabel ownership to appuser:appuser so downloads are not lost on restart.
    # Fix: add `user: root` to the service and chown the volume after startup,
    # OR ensure the host directory is owned by appuser:appuser before `docker compose up`.
    # See issue #21.
    volumes:
      - downloads:/data/downloads
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,size=2G
      # spotdl config + yt-dlp/Deno caches; must be writable with read_only: true
      - /home/appuser:size=256M,uid=999,gid=999,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  downloads:
